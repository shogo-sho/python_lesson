<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF2 Inspector - Wild Rose Build</title>
<style>
  /* FF2の重厚な世界観：深い紺から黒へのグラデーション */
  body { font-family: "Consolas", "Monaco", monospace; padding: 15px; background: linear-gradient(135deg, #000022, #110011, #000000); background-attachment: fixed; color: #f0f0f0; max-width: 800px; margin: 0 auto; min-height: 100vh; }
  
  /* FF2ウィンドウ：特徴的な「二重の縁取り」をイメージ */
  textarea, .hourly-box, .history-area, .total-area, #scanner-input { 
    background: linear-gradient(to bottom, #000088, #000044); 
    border: 2px solid #e0e0e0; 
    box-shadow: 0 0 0 2px #444, 0 4px 10px rgba(0,0,0,0.8); 
    color: #fff; 
  }
  
  label, .section-title { display: block; font-size: 13px; color: #ffccff; margin-bottom: 5px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
  
  textarea { width: 100%; height: 150px; padding: 12px; border-radius: 4px; font-family: inherit; font-size: 14px; box-sizing: border-box; resize: vertical; margin-bottom: 10px; line-height: 1.5; outline: none; }
  
  /* ボタンは反乱軍の象徴「のばら」をイメージしたカラー */
  button { padding: 12px 16px; cursor: pointer; width: 100%; font-family: inherit; font-weight: bold; background: #e0e0e0; color: #000; border: 2px solid #660066; border-radius: 4px; margin-bottom: 20px; transition: 0.2s; }
  button:hover { background: #ffccff; }
  button:active { transform: scale(0.98); }

  #scanner-input { padding: 12px; font-size: 18px; width: 100%; box-sizing: border-box; border-radius: 4px; border: 2px solid #e0e0e0; text-align: center; margin-bottom: 20px; outline: none; }
  
  .total-area { font-size: 18px; font-weight: bold; margin-bottom: 15px; padding: 15px; border-radius: 4px; border: 2px solid #e0e0e0; display: flex; flex-direction: column; align-items: center; }
  .spin-card { font-size: 56px; font-weight: bold; color: #ffffff; text-shadow: 0 0 10px #ff00ff, 0 0 20px #880088; transition: transform 0.4s; display: inline-block; }
  .spin-active { animation: horizontal-spin 0.4s ease-in-out; }
  @keyframes horizontal-spin { 0% { transform: rotateY(0deg); } 50% { transform: rotateY(90deg); } 100% { transform: rotateY(0deg); } }
  
  .char-container { display: flex; align-items: center; background: rgba(0, 0, 0, 0.8); border: 2px solid #e0e0e0; border-radius: 4px; padding: 10px; margin-bottom: 15px; }
  .char-icon { width: 100px; height: 100px; image-rendering: pixelated; object-fit: contain; }
  .char-msg { margin-left: 12px; font-size: 13px; color: #fff; font-weight: bold; line-height: 1.4; }
  
  .hourly-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
  .hourly-box { border-radius: 4px; padding: 8px 5px; text-align: center; border: 2px solid #e0e0e0; }
  
  /* 現在の時間帯 */
  .active-hour { background: #e0e0e0; color: #000; box-shadow: 0 0 15px #ffccff; }
  .active-hour .time-label, .active-hour .count-val { color: #000; }
  
  .time-label { font-size: 10px; color: #ffccff; display: block; margin-bottom: 2px; }
  .count-val { font-size: 22px; font-weight: bold; color: #ffffff; }
  
  .history-area { padding: 10px; border-radius: 4px; min-height: 80px; max-height: 180px; overflow-y: auto; margin-bottom: 15px; border: 2px solid #e0e0e0; }
  .history-item { border-bottom: 1px solid rgba(255,204,255,0.3); padding: 5px 0; font-size: 13px; display: flex; align-items: center; }
  .barcode-link { color: #ffccff; cursor: pointer; margin-left: 8px; text-decoration: underline; }
  
  #toast { visibility: hidden; min-width: 180px; background: #e0e0e0; color: #000; border: 2px solid #660066; text-align: center; border-radius: 4px; padding: 10px; position: fixed; z-index: 100; left: 50%; bottom: 20px; transform: translateX(-50%); font-size: 13px; font-weight: bold; }
  #toast.show { visibility: visible; }
</style>
</head>
<body onmousedown="handleGlobalMouseDown(event)">

  <div class="char-container">
    <img src="ff2_00001.png" id="char-icon" class="char-icon" onerror="this.src='ff2_00001.png'">
    <div class="char-msg">
      <span style="color:#ffccff; font-size:10px;">REBEL STATUS</span><br>
      <span id="char-status">合言葉は……「のばら」！<br>帝国軍を 迎え撃つ 準備を。</span>
    </div>
  </div>

  <div class="memo-area">
    <label>【 覚えた言葉（メモ） 】</label>
    <textarea id="userMemo" placeholder="冒険の中で得たキーワードを記す..."></textarea>
  </div>
  <button onclick="copyMemo(event)">記録をすべて転写する</button>

  <input type="text" id="scanner-input" placeholder="スキャンしてください" autofocus>

  <div class="total-area">
    <span>TOTAL PROFICIENCY / EXP</span>
    <div class="spin-card" id="totalCount">0</div>
  </div>

  <div class="hourly-container" id="hourlyWrapper"></div>

  <div class="section-title">【 戦闘履歴 】</div>
  <div class="history-area" id="historyLog"></div>

  <div id="toast">転写完了！</div>

<script>
  let total = 0;
  let scannedCodes = new Set();
  const input = document.getElementById('scanner-input');
  const charIcon = document.getElementById('char-icon');
  const statusLabel = document.getElementById('char-status');
  const totalDisplay = document.getElementById('totalCount');
  const historyLog = document.getElementById('historyLog');
  const userMemo = document.getElementById('userMemo');

  // ★ ff2_ に設定
  const prefix = "ff2_"; 
  const totalImages = 170; 

  function handleGlobalMouseDown(e) {
    if (e.target !== userMemo && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
      setTimeout(() => input.focus(), 10);
    }
  }

  function updateMonster(num) {
    const idStr = String(num).padStart(5, '0');
    charIcon.src = prefix + idStr + ".png";
  }

  input.addEventListener('change', function() {
    const code = this.value.trim();
    if (!code) return;
    if (scannedCodes.has(code)) {
        statusLabel.innerText = "その まものには すでに 勝利している！";
        this.value = '';
        return;
    }

    const randomNum = Math.floor(Math.random() * totalImages) + 1;
    updateMonster(randomNum);
    statusLabel.innerText = "スキャンせいこう！ 熟練度が 上がった！";

    const now = new Date();
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `<span style="color:#ccc;">[${now.toLocaleTimeString()}]</span><span class="barcode-link" onclick="copyBarcode(event, this)">${code}</span>`;
    historyLog.insertBefore(item, historyLog.firstChild);

    scannedCodes.add(code);
    total++;
    totalDisplay.classList.remove('spin-active');
    void totalDisplay.offsetWidth; 
    totalDisplay.classList.add('spin-active');
    setTimeout(() => { totalDisplay.innerText = total; }, 200);

    const h = now.getHours();
    const targetBox = document.getElementById(`count-${h}`);
    if (targetBox) {
        targetBox.innerText = parseInt(targetBox.innerText) + 1;
        highlightCurrentHour(h);
    }
    this.value = '';
    input.focus();
  });

  function highlightCurrentHour(h) {
    document.querySelectorAll('.hourly-box').forEach(box => box.classList.remove('active-hour'));
    const currentBox = document.querySelector(`.hourly-box[data-hour="${h}"]`);
    if (currentBox) currentBox.classList.add('active-hour');
  }

  function init() {
    const wrapper = document.getElementById('hourlyWrapper');
    const currentH = new Date().getHours();
    for (let h = 9; h < 18; h++) {
      const box = document.createElement('div');
      box.className = 'hourly-box' + (h === currentH ? ' active-hour' : '');
      box.setAttribute('data-hour', h);
      box.innerHTML = `<span class="time-label">${h}:00-${h+1}:00</span><span class="count-val" id="count-${h}">0</span>`;
      wrapper.appendChild(box);
    }
    userMemo.value = localStorage.getItem('myWorkMemo') || '';
  }

  async function copyMemo(e) {
    e.preventDefault();
    try {
      await navigator.clipboard.writeText(userMemo.value);
      showToast("記録をコピーしました");
    } catch (err) {
      userMemo.select();
      document.execCommand('copy');
      showToast("記録をコピーしました");
    }
    input.focus();
  }

  function copyBarcode(e, el) {
    e.stopPropagation();
    navigator.clipboard.writeText(el.innerText);
    showToast("コピー: " + el.innerText);
    input.focus();
  }

  function showToast(msg) {
    const x = document.getElementById("toast");
    x.innerText = msg; x.className = "show";
    setTimeout(() => { x.className = ""; }, 2000);
  }

  userMemo.addEventListener('input', function() {
    localStorage.setItem('myWorkMemo', this.value);
  });

  init();
</script>
</body>
</html>
