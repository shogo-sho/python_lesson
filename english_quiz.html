<h1>📖 英単語問題集</h1>
<p class="subtitle">中学・高校レベル｜全1500語収録</p>

<!-- START SCREEN -->
<div id="startScreen">
  <h2>クイズの設定</h2>

  <div class="option-group">
    <label>出題モード</label>
    <div class="radio-row">
      <div class="radio-btn selected" data-group="mode" data-val="en2jp">英語 → 日本語</div>
      <div class="radio-btn" data-group="mode" data-val="jp2en">日本語 → 英語</div>
      <div class="radio-btn" data-group="mode" data-val="mix">ミックス</div>
    </div>
  </div>

  <div class="option-group">
    <label>レベル</label>
    <div class="radio-row">
      <div class="radio-btn selected" data-group="level" data-val="all">全レベル</div>
      <div class="radio-btn" data-group="level" data-val="junior">中学</div>
      <div class="radio-btn" data-group="level" data-val="senior">高校</div>
    </div>
  </div>

  <div class="option-group">
    <label>出題数：<span class="count-val" id="countVal">20</span> 問</label>
    <input type="range" class="count-slider" id="countSlider" min="5" max="100" value="20" step="5">
  </div>

  <button class="start-btn" id="startBtn">スタート！</button>
</div>

<!-- QUIZ SCREEN -->
<div id="quizScreen">
  <div class="score-bar">
    <div class="score-item correct-c">正解 <span id="correctCount">0</span></div>
    <span class="sep">|</span>
    <div class="score-item incorrect-c">不正解 <span id="incorrectCount">0</span></div>
    <span class="sep">|</span>
    <div class="score-item hint-c">ヒント使用 <span id="hintCount">0</span></div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="progress-text" id="progressText">1 / 20</div>

  <div class="card">
    <span class="mode-badge" id="modeBadge"></span>
    <div class="question-word" id="questionWord"></div>
    <div class="question-note" id="questionNote"></div>

    <div class="hint-row">
      <button class="hint-btn" id="hintPos" onclick="showHint('pos')">💡 品詞を見る</button>
      <button class="hint-btn" id="hintLetter" onclick="showHint('letter')">🔤 最初の文字</button>
      <button class="hint-btn" id="hintEx" onclick="showHint('example')">📝 例文を見る</button>
    </div>
    <div class="hint-display" id="hintDisplay"></div>

    <input type="text" class="answer-input" id="answerInput"
           placeholder="答えを入力してください..."
           onkeydown="if(event.key==='Enter')checkAnswer()">

    <div class="action-row">
      <button class="skip-btn" onclick="skipQuestion()">スキップ</button>
      <button class="submit-btn" id="submitBtn" onclick="checkAnswer()">答え合わせ</button>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次へ →</button>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="resultScreen">
  <div class="result-title">🎉 クイズ終了！</div>
  <div class="result-score" id="resultScore"></div>
  <div class="result-sub" id="resultSub"></div>
  <div class="result-grid">
    <div class="result-box c"><div class="num" id="rCorrect">0</div><div class="lbl">正解</div></div>
    <div class="result-box w"><div class="num" id="rWrong">0</div><div class="lbl">不正解</div></div>
    <div class="result-box h"><div class="num" id="rHint">0</div><div class="lbl">ヒント使用</div></div>
  </div>
  <div class="mistake-section" id="mistakeSection"></div>
  <button class="retry-btn" onclick="retryMistakes()">間違えた問題だけやり直す</button>
  <button class="retry-btn" style="background: linear-gradient(135deg,#6a5acd,#483d8b); margin-bottom:10px" onclick="restart()">同じ設定でもう一度</button>
  <button class="home-btn" onclick="goHome()">設定に戻る</button>
</div>

// =====================================================================
// STATE
// =====================================================================
let settings = { mode:"en2jp", level:"all", count:20 };
let queue = [];
let current = 0;
let stats = { correct:0, incorrect:0, hints:0 };
let mistakes = [];
let hintsUsed = { pos:false, letter:false, example:false };
let answered = false;
let retryMode = false;

// =====================================================================
// START SCREEN
// =====================================================================
document.querySelectorAll('.radio-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const group = this.dataset.group;
    document.querySelectorAll(`.radio-btn[data-group="${group}"]`).forEach(b => b.classList.remove('selected'));
    this.classList.add('selected');
    settings[group] = this.dataset.val;
  });
});

const countSlider = document.getElementById('countSlider');
const countVal = document.getElementById('countVal');
countSlider.addEventListener('input', () => { countVal.textContent = countSlider.value; });

document.getElementById('startBtn').addEventListener('click', startQuiz);

function startQuiz() {
  let pool = WORDS.filter(w => {
    if (settings.level === 'junior') return w.level === 'junior';
    if (settings.level === 'senior') return w.level === 'senior';
    return true;
  });
  // shuffle
  pool = pool.sort(() => Math.random() - 0.5);
  const count = Math.min(parseInt(countSlider.value), pool.length);
  queue = pool.slice(0, count);
  current = 0;
  stats = { correct:0, incorrect:0, hints:0 };
  mistakes = [];
  retryMode = false;

  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  document.getElementById('resultScreen').style.display = 'none';
  renderQuestion();
}

// =====================================================================
// QUIZ
// =====================================================================
function getMode(idx) {
  if (settings.mode === 'en2jp') return 'en2jp';
  if (settings.mode === 'jp2en') return 'jp2en';
  return idx % 2 === 0 ? 'en2jp' : 'jp2en';
}

function renderQuestion() {
  const w = queue[current];
  const mode = getMode(current);
  answered = false;
  hintsUsed = { pos:false, letter:false, example:false };

  // Progress
  const pct = (current / queue.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${current + 1} / ${queue.length}`;

  // Badge
  const badge = document.getElementById('modeBadge');
  if (mode === 'en2jp') {
    badge.textContent = '英語 → 日本語';
    badge.className = 'mode-badge badge-en';
    document.getElementById('questionNote').textContent = '日本語の意味を入力してください';
  } else {
    badge.textContent = '日本語 → 英語';
    badge.className = 'mode-badge badge-jp';
    document.getElementById('questionNote').textContent = '英単語を入力してください';
  }

  document.getElementById('questionWord').textContent = mode === 'en2jp' ? w.en : w.jp;

  // Hints
  document.getElementById('hintDisplay').textContent = '';
  document.getElementById('hintPos').classList.remove('used');
  document.getElementById('hintLetter').classList.remove('used');
  document.getElementById('hintEx').classList.remove('used');
  ['hintPos','hintLetter','hintEx'].forEach(id => {
    document.getElementById(id).disabled = false;
  });

  // Input
  const input = document.getElementById('answerInput');
  input.value = '';
  input.className = 'answer-input';
  input.disabled = false;
  input.placeholder = mode === 'en2jp' ? '日本語で入力...' : 'English word...';

  // Buttons
  document.getElementById('submitBtn').style.display = '';
  document.getElementById('nextBtn').style.display = 'none';

  // Feedback
  const fb = document.getElementById('feedback');
  fb.style.display = 'none';
  fb.className = 'feedback';

  // Scores
  document.getElementById('correctCount').textContent = stats.correct;
  document.getElementById('incorrectCount').textContent = stats.incorrect;
  document.getElementById('hintCount').textContent = stats.hints;

  input.focus();
}

function showHint(type) {
  const w = queue[current];
  const mode = getMode(current);
  const display = document.getElementById('hintDisplay');
  const btn = document.getElementById(type === 'pos' ? 'hintPos' : type === 'letter' ? 'hintLetter' : 'hintEx');
  const wasUsed = hintsUsed[type === 'pos' ? 'pos' : type === 'letter' ? 'letter' : 'example'];

  if (!wasUsed) {
    if (!answered) stats.hints++;
    hintsUsed[type === 'pos' ? 'pos' : type === 'letter' ? 'letter' : 'example'] = true;
    btn.classList.add('used');
    document.getElementById('hintCount').textContent = stats.hints;
  }

  let hints = [];
  if (hintsUsed.pos) hints.push(`💡 品詞: ${w.pos}`);
  if (hintsUsed.letter) {
    const target = mode === 'en2jp' ? w.jp : w.en;
    hints.push(`🔤 最初の文字: 「${target[0]}」（全${target.length}文字）`);
  }
  if (hintsUsed.example) hints.push(`📝 例文: ${w.ex}`);
  display.textContent = hints.join('　　');
}

function checkAnswer() {
  if (answered) return;
  const w = queue[current];
  const mode = getMode(current);
  const input = document.getElementById('answerInput');
  const userAns = input.value.trim();
  if (!userAns) { input.focus(); return; }

  answered = true;
  input.disabled = true;

  // Normalize answer comparison
  const correctAns = mode === 'en2jp' ? w.jp : w.en;
  const normalize = s => s.toLowerCase().replace(/[・、。\s　]/g, '');
  const isCorrect = normalize(userAns) === normalize(correctAns) ||
    (mode === 'en2jp' && correctAns.split('・').some(c => normalize(userAns) === normalize(c))) ||
    (mode === 'jp2en' && normalize(userAns) === normalize(w.en));

  const fb = document.getElementById('feedback');
  fb.style.display = 'block';

  const conjHTML = (w.past || w.pp)
    ? `<br><small style="color:#a0d8ef;">過去形: <strong>${w.past||'—'}</strong>　過去分詞: <strong>${w.pp||'—'}</strong></small>`
    : '';

  if (isCorrect) {
    stats.correct++;
    input.classList.add('correct');
    fb.className = 'feedback correct';
    fb.innerHTML = `✅ 正解！　正答: ${correctAns}${conjHTML}`;
  } else {
    stats.incorrect++;
    input.classList.add('incorrect');
    fb.className = 'feedback incorrect';
    fb.innerHTML = `❌ 不正解　正答: <strong>${correctAns}</strong>${conjHTML}`;
    mistakes.push({ ...w, mode });
  }

  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('correctCount').textContent = stats.correct;
  document.getElementById('incorrectCount').textContent = stats.incorrect;
}

function skipQuestion() {
  if (answered) return;
  answered = true;
  const w = queue[current];
  const mode = getMode(current);
  const correctAns = mode === 'en2jp' ? w.jp : w.en;
  stats.incorrect++;
  mistakes.push({ ...w, mode });
  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  fb.className = 'feedback incorrect';
  const conjHTML2 = (w.past || w.pp)
    ? `<br><small style="color:#a0d8ef;">過去形: <strong>${w.past||'—'}</strong>　過去分詞: <strong>${w.pp||'—'}</strong></small>`
    : '';
  fb.innerHTML = `⏭ スキップ　正答: <strong>${correctAns}</strong>${conjHTML2}`;
  document.getElementById('answerInput').disabled = true;
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('incorrectCount').textContent = stats.incorrect;
}

function nextQuestion() {
  current++;
  if (current >= queue.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

// =====================================================================
// RESULT
// =====================================================================
function showResult() {
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  const total = queue.length;
  const pct = Math.round((stats.correct / total) * 100);
  document.getElementById('resultScore').textContent = `${pct}%`;
  document.getElementById('resultSub').textContent = `${total}問中 ${stats.correct}問正解`;
  document.getElementById('rCorrect').textContent = stats.correct;
  document.getElementById('rWrong').textContent = stats.incorrect;
  document.getElementById('rHint').textContent = stats.hints;

  const ms = document.getElementById('mistakeSection');
  if (mistakes.length === 0) {
    ms.innerHTML = '<p style="color:#4caf50;text-align:center;font-size:0.95rem;">🎉 全問正解です！素晴らしい！</p>';
  } else {
    ms.innerHTML = `<h3>間違えた問題（${mistakes.length}問）</h3>` +
      [...new Map(mistakes.map(m => [m.en, m])).values()].map(m =>
        `<div class="mistake-item">
          <span class="en">${m.en}</span> ／ ${m.jp}
          <span style="color:#aaa;font-size:0.8rem;margin-left:8px;">${m.pos}</span>
        </div>`
      ).join('');
  }

  // Hide retry button if no mistakes
  document.querySelector('.retry-btn').style.display = mistakes.length ? '' : 'none';
}

function retryMistakes() {
  if (mistakes.length === 0) return;
  const unique = [...new Map(mistakes.map(m => [m.en, m])).values()];
  queue = unique.sort(() => Math.random() - 0.5);
  current = 0;
  stats = { correct:0, incorrect:0, hints:0 };
  mistakes = [];
  retryMode = true;

  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  renderQuestion();
}

function restart() {
  document.getElementById('resultScreen').style.display = 'none';
  startQuiz();
}

function goHome() {
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'block';
}
</script>
