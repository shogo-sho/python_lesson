<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DQ4 Inspector - Zenithian Map Edition</title>
<style>
  body { 
    font-family: "Consolas", "Monaco", monospace; padding: 15px; 
    background-image: url('DQ4DS_Overworld_Tileset_Final.png'); 
    background-color: #001a33;
    background-size: cover; 
    background-position: center;
    background-attachment: fixed; 
    color: #f0f0f0; 
    max-width: 800px; margin: 0 auto; min-height: 100vh; 
  }

  textarea, .hourly-box, .history-area, .total-area, #scanner-input, .char-container { 
    background: rgba(0, 0, 0, 0.82); 
    border: 3px solid #fff; border-radius: 4px; 
    box-shadow: 0 0 0 2px #000, 4px 4px 0px rgba(0,0,0,0.5); color: #fff; 
  }

  label, .section-title { 
    display: block; font-size: 14px; color: #ffd700; 
    margin-bottom: 5px; font-weight: bold; 
    text-shadow: 2px 2px 4px #000;
  }

  textarea { width: 100%; height: 120px; padding: 12px; font-family: inherit; font-size: 14px; box-sizing: border-box; resize: vertical; margin-bottom: 10px; line-height: 1.6; outline: none; }
  button { padding: 10px 16px; cursor: pointer; width: 100%; font-family: inherit; font-weight: bold; background: #fff; color: #000; border: 2px solid #000; border-radius: 4px; margin-bottom: 20px; }
  button:hover { background: #ffd700; }

  #scanner-input { padding: 12px; font-size: 20px; width: 100%; box-sizing: border-box; text-align: center; margin-bottom: 25px; outline: none; }

  .char-container { 
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; margin-bottom: 20px; min-height: 130px;
  }
  .char-icon { width: 100px; height: 100px; image-rendering: pixelated; object-fit: contain; margin-right: 15px; }
  .char-msg { flex: 1; font-size: 15px; color: #fff; font-weight: bold; line-height: 1.6; }

  .manya-wrap {
    width: 80px; height: 80px; overflow: hidden; position: relative;
    background: #000; border-radius: 4px; margin-left: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .manya-gif { 
    width: auto; 
    height: 105%; 
    image-rendering: pixelated; 
    object-fit: contain;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -45%); 
  }

  .total-area { margin-bottom: 20px; padding: 15px; display: flex; flex-direction: column; align-items: center; border-color: #ffd700; }
  .spin-card { font-size: 60px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #ffd700; display: inline-block; }

  .hourly-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
  .hourly-box { padding: 10px 5px; text-align: center; border-width: 2px; }
  .active-hour { border-color: #ffd700; background: rgba(0, 34, 68, 0.8); }
  .time-label { font-size: 11px; color: #ffd700; display: block; margin-bottom: 4px; }
  .count-val { font-size: 24px; font-weight: bold; }

  .history-area { padding: 12px; min-height: 100px; max-height: 200px; overflow-y: auto; margin-bottom: 20px; }
  .history-item { border-bottom: 1px solid #444; padding: 6px 0; font-size: 14px; }
  .barcode-link { color: #ffd700; cursor: pointer; margin-left: 10px; text-decoration: underline; }

  #toast { visibility: hidden; min-width: 200px; background: #fff; color: #000; border: 2px solid #000; text-align: center; border-radius: 4px; padding: 12px; position: fixed; z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; }
  #toast.show { visibility: visible; }
</style>
</head>
<body onmousedown="handleGlobalMouseDown(event)">

  <div class="char-container">
    <img src="dq4_00001.png" id="char-icon" class="char-icon" onerror="this.src='dq4_00001.png'">
    <div class="char-msg">
      <span style="color:#ffd700; font-size:11px;">WORLD MAP STATUS</span><br>
      <span id="char-status">天空の地図を 広げた！<br>検品を 開始せよ！</span>
    </div>
    <div class="manya-wrap">
      <img src="dq4_manya.gif" class="manya-gif">
    </div>
  </div>

  <div class="memo-area">
    <label>【 さくせんメモ 】</label>
    <textarea id="userMemo" placeholder="冒険の記録（メモ）を記す..."></textarea>
  </div>
  <button onclick="copyMemo(event)">記録を すべて コピーする</button>

  <label>【 アイテムを スキャンせよ 】</label>
  <input type="text" id="scanner-input" placeholder="スキャン待ち..." autofocus>

  <div class="total-area">
    <span style="font-size: 14px; color: #ffd700;">TOTAL EXPERIENCE</span>
    <div class="spin-card" id="totalCount">0</div>
  </div>

  <div class="hourly-container" id="hourlyWrapper"></div>
  <div class="section-title">【 ばしゃのなか（履歴） 】</div>
  <div class="history-area" id="historyLog"></div>

  <div id="toast">記録を 写し取った！</div>

  <script>
    let total = 0;
    let scannedCodes = new Set();
    const input = document.getElementById('scanner-input');
    const charIcon = document.getElementById('char-icon');
    const statusLabel = document.getElementById('char-status');
    const totalDisplay = document.getElementById('totalCount');
    const historyLog = document.getElementById('historyLog');
    const userMemo = document.getElementById('userMemo');

    const prefix = "dq4_"; 
    const totalImages = 240; 

    function handleGlobalMouseDown(e) {
      if (e.target !== userMemo && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
        setTimeout(() => input.focus(), 10);
      }
    }

    function updateMonster(num) {
      const idStr = String(num).padStart(5, '0');
      charIcon.src = prefix + idStr + ".png";
    }

    input.addEventListener('change', function() {
      const code = this.value.trim();
      if (!code) return;
      if (scannedCodes.has(code)) {
          statusLabel.innerHTML = `それは すでに 検品済みだ！`;
          this.value = '';
          return;
      }
      const randomNum = Math.floor(Math.random() * totalImages) + 1;
      updateMonster(randomNum);
      statusLabel.innerHTML = `スキャン せいこう！<br>${code} を 確認した！`;
      const now = new Date();
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `<span style="color:#888;">[${now.toLocaleTimeString()}]</span><span class="barcode-link" onclick="copyBarcode(event, this)">${code}</span>`;
      historyLog.insertBefore(item, historyLog.firstChild);
      scannedCodes.add(code);
      total++;
      totalDisplay.innerText = total;
      const h = now.getHours();
      const targetBox = document.getElementById(`count-${h}`);
      if (targetBox) {
          targetBox.innerText = parseInt(targetBox.innerText) + 1;
          highlightCurrentHour(h);
      }
      this.value = '';
      input.focus();
    });

    function highlightCurrentHour(h) {
      document.querySelectorAll('.hourly-box').forEach(box => box.classList.remove('active-hour'));
      const currentBox = document.querySelector(`.hourly-box[data-hour="${h}"]`);
      if (currentBox) currentBox.classList.add('active-hour');
    }

    function init() {
      const wrapper = document.getElementById('hourlyWrapper');
      const currentH = new Date().getHours();
      for (let h = 9; h < 18; h++) {
        const box = document.createElement('div');
        box.className = 'hourly-box' + (h === currentH ? ' active-hour' : '');
        box.setAttribute('data-hour', h);
        box.innerHTML = `<span class="time-label">${h}:00-${h+1}:00</span><span class="count-val" id="count-${h}">0</span>`;
        wrapper.appendChild(box);
      }
      userMemo.value = localStorage.getItem('myWorkMemo') || '';
    }

    async function copyMemo(e) {
      e.preventDefault();
      try { await navigator.clipboard.writeText(userMemo.value); showToast("記録を 写し取った！"); } 
      catch (err) { userMemo.select(); document.execCommand('copy'); showToast("記録を 写し取った！"); }
      input.focus();
    }

    function copyBarcode(e, el) {
      e.stopPropagation();
      navigator.clipboard.writeText(el.innerText);
      showToast(el.innerText + " を コピー！");
      input.focus();
    }

    function showToast(msg) {
      const x = document.getElementById("toast");
      x.innerText = msg; x.className = "show";
      setTimeout(() => { x.className = ""; }, 2000);
    }

    userMemo.addEventListener('input', function() { localStorage.setItem('myWorkMemo', this.value); });

    init();
  </script>
</body>
</html>
