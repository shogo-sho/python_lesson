<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DQ6 Inspector - Realms of Revelation Edition</title>
<style>
  body { 
    font-family: "Consolas", "Monaco", monospace; padding: 15px; 
    background-image: url('dread-realm-2.png'); 
    background-color: #1a052e;
    background-size: cover; 
    background-position: center;
    background-attachment: fixed; 
    color: #f0f0f0; 
    max-width: 800px; margin: 0 auto; min-height: 100vh; 
  }

  textarea, .hourly-box, .history-area, .total-area, #scanner-input, .char-container { 
    background: rgba(0, 0, 0, 0.88); 
    border: 2px solid #fff; border-radius: 4px;
    box-shadow: 0 0 0 2px #000, 4px 4px 0px rgba(0,0,0,0.8); color: #fff; 
  }

  label, .section-title { 
    display: block; font-size: 14px; color: #d4af37;
    margin-bottom: 5px; font-weight: bold; text-shadow: 2px 2px 2px #000;
  }

  textarea { 
    width: 100%; height: 120px; padding: 12px; font-family: inherit; font-size: 14px; 
    box-sizing: border-box; resize: vertical; margin-bottom: 10px; line-height: 1.6; outline: none;
  }

  button { 
    padding: 12px 16px; cursor: pointer; width: 100%; font-family: inherit; font-weight: bold; 
    background: #003366; color: #fff; border: 2px solid #fff; border-radius: 4px; 
    margin-bottom: 25px; transition: 0.2s;
  }
  button:hover { background: #004080; border-color: #d4af37; }

  #scanner-input { 
    padding: 12px; font-size: 20px; width: 100%; box-sizing: border-box; 
    text-align: center; margin-bottom: 25px; outline: none; border: 2px solid #d4af37;
  }

  .char-container { 
    display: flex; align-items: center; 
    padding: 12px; margin-bottom: 20px; min-height: 144px;
  }

  .char-icon-wrap {
    width: 120px; height: 120px;
    min-width: 120px; 
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  .char-icon { 
    width: 100%; height: 100%; 
    image-rendering: pixelated; 
    object-fit: contain;
    display: block;
  }

  .char-msg { flex: 1; margin-left: 15px; font-size: 15px; color: #fff; font-weight: bold; line-height: 1.6; }

  .total-area { margin-bottom: 20px; padding: 15px; display: flex; flex-direction: column; align-items: center; border-color: #d4af37; }
  .spin-card { font-size: 60px; font-weight: bold; color: #fff; text-shadow: 0 0 15px #b19cd9; display: inline-block; }
  .spin-active { animation: horizontal-spin 0.4s ease-in-out; }
  @keyframes horizontal-spin { 0% { transform: rotateY(0deg); } 50% { transform: rotateY(90deg); } 100% { transform: rotateY(0deg); } }

  .hourly-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
  .hourly-box { padding: 10px 5px; text-align: center; border-width: 2px; }
  .active-hour { border-color: #d4af37; background: #002244; }
  .time-label { font-size: 10px; color: #d4af37; display: block; margin-bottom: 4px; }
  .count-val { font-size: 24px; font-weight: bold; }

  .history-area { padding: 12px; min-height: 100px; max-height: 200px; overflow-y: auto; margin-bottom: 20px; }
  .history-item { border-bottom: 1px solid #333; padding: 6px 0; font-size: 13px; }
  .scan-label { color: #d1b3ff !important; text-shadow: 1px 1px 3px #000; }
  .barcode-link { color: #b19cd9; cursor: pointer; margin-left: 10px; text-decoration: underline; }
  #toast { visibility: hidden; min-width: 200px; background: #fff; color: #000; border: 2px solid #000; text-align: center; border-radius: 4px; padding: 12px; position: fixed; z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; }
  #toast.show { visibility: visible; }
</style>
</head>
<body onmousedown="handleGlobalMouseDown(event)">

  <div class="char-container">
    <div class="char-icon-wrap">
      <img src="dq6_00001.gif" id="char-icon" class="char-icon">
    </div>
    <div class="char-msg">
      <span style="color:#d4af37; font-size:10px;">ADVENTURE LOG (DQ6)</span><br>
      <span id="char-status">幻の大地の 地図を 広げた！<br>検品を 開始せよ！</span>
    </div>
  </div>

  <div class="memo-area">
    <label>【 冒険の記録（メモ） 】</label>
    <textarea id="userMemo" placeholder="旅の途中で気づいたことを記す..."></textarea>
  </div>
  <button onclick="copyMemo(event)">記録を すべて 写し取る</button>

  <label class="scan-label">【 魔物が あらわれた！ 】</label>
  <input type="text" id="scanner-input" placeholder="スキャンして仲間にする..." autofocus>

  <div class="total-area">
    <span style="font-size: 14px; color: #d4af37;">TOTAL MONSTERS TAMED</span>
    <div class="spin-card" id="totalCount">0</div>
  </div>

  <div class="hourly-container" id="hourlyWrapper"></div>
  <div class="section-title">【 モンスターずかん（履歴） 】</div>
  <div class="history-area" id="historyLog"></div>
  <div id="toast">記録を 写し取った！</div>

<script>
  let total = 0;
  let scannedCodes = new Set();
  let retryCount = 0; // リトライ回数管理
  const input = document.getElementById('scanner-input');
  const charIcon = document.getElementById('char-icon');
  const statusLabel = document.getElementById('char-status');
  const totalDisplay = document.getElementById('totalCount');
  const historyLog = document.getElementById('historyLog');
  const userMemo = document.getElementById('userMemo');

  const MAX_ID = 263;

  function handleGlobalMouseDown(e) {
    if (e.target !== userMemo && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
      setTimeout(() => input.focus(), 10);
    }
  }

  // ★画像エラー時のリトライ処理を強化
  charIcon.onerror = function() {
    const currentSrc = this.src;
    
    if (currentSrc.endsWith('.gif')) {
      // GIFがなければ同番号のPNGを試す
      this.src = currentSrc.replace('.gif', '.png');
    } else {
      // PNGもなければ別の番号を再抽選（最大10回まで）
      if (retryCount < 10) {
        retryCount++;
        console.log("画像欠番のため再抽選中... 回数: " + retryCount);
        updateMonster();
      } else {
        // 10回探してなければ諦めて隠す
        this.style.visibility = 'hidden';
        retryCount = 0;
      }
    }
  };

  function updateMonster() {
    charIcon.style.visibility = 'visible';
    const randomNum = Math.floor(Math.random() * MAX_ID) + 1;
    const idStr = String(randomNum).padStart(5, '0');
    // まずGIFから読み込み開始
    charIcon.src = "dq6_" + idStr + ".gif";
  }

  input.addEventListener('change', function() {
    const code = this.value.trim();
    if (!code) return;
    if (scannedCodes.has(code)) {
        statusLabel.innerHTML = `そのコードは すでに 検品済みだ！<br>魔物は はざまの世界へ 逃げ出した。`;
        this.value = '';
        return;
    }
    
    retryCount = 0; // スキャンごとにリトライ回数をリセット
    updateMonster();
    
    statusLabel.innerHTML = `なんと 魔物が おきあがり……<br>${code} が 仲間に 加わった！`;
    const now = new Date();
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `<span style="color:#888;">[${now.toLocaleTimeString()}]</span><span class="barcode-link" onclick="copyBarcode(event, this)">${code}</span>`;
    historyLog.insertBefore(item, historyLog.firstChild);
    scannedCodes.add(code);
    total++;
    totalDisplay.classList.remove('spin-active');
    void totalDisplay.offsetWidth; 
    totalDisplay.classList.add('spin-active');
    setTimeout(() => { totalDisplay.innerText = total; }, 200);
    const h = now.getHours();
    const targetBox = document.getElementById(`count-${h}`);
    if (targetBox) {
        targetBox.innerText = parseInt(targetBox.innerText) + 1;
        highlightCurrentHour(h);
    }
    this.value = '';
    input.focus();
  });

  function highlightCurrentHour(h) {
    document.querySelectorAll('.hourly-box').forEach(box => box.classList.remove('active-hour'));
    const currentBox = document.querySelector(`.hourly-box[data-hour="${h}"]`);
    if (currentBox) currentBox.classList.add('active-hour');
  }

  function init() {
    const wrapper = document.getElementById('hourlyWrapper');
    const currentH = new Date().getHours();
    for (let h = 9; h < 18; h++) {
      const box = document.createElement('div');
      box.className = 'hourly-box' + (h === currentH ? ' active-hour' : '');
      box.setAttribute('data-hour', h);
      box.innerHTML = `<span class="time-label">${h}:00-${h+1}:00</span><span class="count-val" id="count-${h}">0</span>`;
      wrapper.appendChild(box);
    }
    userMemo.value = localStorage.getItem('myWorkMemo') || '';
  }

  async function copyMemo(e) {
    e.preventDefault();
    try { await navigator.clipboard.writeText(userMemo.value); showToast("記録を 写し取った！"); } 
    catch (err) { userMemo.select(); document.execCommand('copy'); showToast("記録を 写し取った！"); }
    input.focus();
  }

  function copyBarcode(e, el) {
    e.stopPropagation();
    navigator.clipboard.writeText(el.innerText);
    showToast(el.innerText + " を 写し取った！");
    input.focus();
  }

  function showToast(msg) {
    const x = document.getElementById("toast");
    x.innerText = msg; x.className = "show";
    setTimeout(() => { x.className = ""; }, 2000);
  }

  userMemo.addEventListener('input', function() { localStorage.setItem('myWorkMemo', this.value); });
  init();
</script>
</body>
</html>
